# ================================================================
# MediNear v4 - application.properties
# ================================================================

spring.application.name=mednear
server.port=8080

# ================================================================
# PostgreSQL
# ================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/MedNear
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================================================
# JPA / Hibernate
# ================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ================================================================
# Cache
# ================================================================
spring.cache.type=simple

# Redis - optional
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.cache.redis.time-to-live=300000

# ================================================================
# JWT
# ================================================================
mednear.app.jwtSecret=${JWT_SECRET}
mednear.app.jwtExpirationMs=86400000

# ================================================================
# Search defaults
# ================================================================
mednear.search.default-radius-km=5.0
mednear.search.max-radius-km=50.0
mednear.search.default-page-size=10
mednear.search.max-page-size=50

# ================================================================
# Google Maps
# ================================================================
google.maps.api-key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_KEY_HERE}
google.maps.base-url=https://maps.googleapis.com

# ================================================================
# Anthropic Claude AI
# ================================================================
anthropic.api-key=${ANTHROPIC_API_KEY:YOUR_ANTHROPIC_KEY_HERE}
anthropic.api-url=https://api.anthropic.com
anthropic.model=claude-sonnet-4-20250514
anthropic.max-tokens=1024

# ================================================================
# OCR & ML Service
# ================================================================
ocr.service.url=${OCR_SERVICE_URL:http://localhost:5000/api/v1/analyze}
ocr.service.timeout-ms=5000

# ================================================================
# File Upload
# ================================================================
mednear.upload.dir=uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ================================================================
# Supabase Storage - Pharmacy Images
# ================================================================
supabase.url=https://inuriqtautztkqawscya.supabase.co
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=pharmacy-images

# ================================================================
# Logging
# ================================================================
logging.level.com.mednear=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.cache=DEBUG